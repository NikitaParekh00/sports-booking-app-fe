<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pickleball Paddle - Matching your PNG exactly -->
  
  <!-- Paddle Head - Rounded rectangle, horizontal stripes -->
  <rect x="16" y="12" width="28" height="24" rx="6" ry="6" 
        fill="none" 
        stroke="#1E40AF" 
        stroke-width="2"/>
  
  <!-- Top Stripe - Light Blue/Cyan -->
  <rect x="18" y="14" width="24" height="6" rx="2" fill="#06B6D4"/>
  
  <!-- Middle Stripe - Orange/Golden Yellow -->
  <rect x="18" y="20" width="24" height="6" rx="2" fill="#F59E0B"/>
  
  <!-- Bottom Stripe - Darker Blue -->
  <rect x="18" y="26" width="24" height="6" rx="2" fill="#1E40AF"/>
  
  <!-- Paddle Handle -->
  <rect x="28" y="36" width="4" height="16" rx="2" 
        fill="#1E3A8A" 
        stroke="#1E40AF" 
        stroke-width="2"/>
  
  <!-- Handle Grip Segments -->
  <rect x="29" y="38" width="2" height="2" fill="#3B82F6"/>
  <rect x="29" y="42" width="2" height="2" fill="#3B82F6"/>
</svg>