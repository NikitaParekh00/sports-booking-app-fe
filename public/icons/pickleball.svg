<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pickleball Paddle -->
  <rect x="16" y="8" width="24" height="32" rx="4" fill="url(#paddleGradient)" stroke="#1E40AF" stroke-width="1.5"/>
  <!-- Paddle Handle -->
  <rect x="26" y="40" width="4" height="16" rx="2" fill="#1E3A8A" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Paddle Holes - Colorful -->
  <circle cx="20" cy="16" r="1.5" fill="#FBBF24"/>
  <circle cx="28" cy="16" r="1.5" fill="#F59E0B"/>
  <circle cx="36" cy="16" r="1.5" fill="#10B981"/>
  <circle cx="20" cy="22" r="1.5" fill="#EF4444"/>
  <circle cx="28" cy="22" r="1.5" fill="#8B5CF6"/>
  <circle cx="36" cy="22" r="1.5" fill="#06B6D4"/>
  <circle cx="20" cy="28" r="1.5" fill="#EC4899"/>
  <circle cx="28" cy="28" r="1.5" fill="#84CC16"/>
  <circle cx="36" cy="28" r="1.5" fill="#F97316"/>
  <circle cx="20" cy="34" r="1.5" fill="#6366F1"/>
  <circle cx="28" cy="34" r="1.5" fill="#14B8A6"/>
  <circle cx="36" cy="34" r="1.5" fill="#EAB308"/>
  
  <!-- Pickleball -->
  <circle cx="48" cy="32" r="6" fill="url(#ballGradient)" stroke="#1E40AF" stroke-width="1.5"/>
  <!-- Ball Holes - Colorful -->
  <circle cx="45" cy="29" r="0.8" fill="#F59E0B"/>
  <circle cx="51" cy="29" r="0.8" fill="#EF4444"/>
  <circle cx="45" cy="35" r="0.8" fill="#8B5CF6"/>
  <circle cx="51" cy="35" r="0.8" fill="#10B981"/>
  <circle cx="48" cy="32" r="0.8" fill="#1E40AF"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="paddleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ballGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE047;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A3E635;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
